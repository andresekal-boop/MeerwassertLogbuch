name: Build unsigned iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show project files
        run: |
          pwd
          ls -la
          ls -la MeerwasserLogbuch.xcodeproj

      - name: Build unsigned iOS app
        run: |
          xcodebuild -project MeerwasserLogbuch.xcodeproj -scheme MeerwasserLogbuch -configuration Release -sdk iphoneos -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/MeerwasserLogbuch.app build/Payload/
          cd build
          /usr/bin/zip -r MeerwasserLogbuch-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MeerwasserLogbuch-unsigned-IPA
          path: build/MeerwasserLogbuch-unsigned.ipa
          if-no-files-found: error
