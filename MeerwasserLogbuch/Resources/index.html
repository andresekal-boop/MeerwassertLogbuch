<script>
/* Native iOS build adapter: local-first storage + configurable secure AI gateway. */
(function(){
  const CFG='mw_ai_gateway_v1';
  const readCfg=()=>{try{return JSON.parse(localStorage.getItem(CFG)||'{}')}catch(_){return {}}};
  window.mwSetAIGateway=function(url,token){
    const clean=String(url||'').trim();
    if(clean && !/^https:\/\//i.test(clean)) throw new Error('Bitte eine HTTPS-Adresse verwenden.');
    localStorage.setItem(CFG,JSON.stringify({url:clean,token:String(token||'').trim()}));
    return true;
  };
  window.mwGetAIGateway=readCfg;
  const b64=blob=>new Promise((resolve,reject)=>{
    const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]||'');r.onerror=reject;r.readAsDataURL(blob);
  });
  async function request(prompt,opts){
    const cfg=readCfg();
    if(!cfg.url) throw {code:'na'};
    const imgs=[];
    for(const item of (opts.images||[])){
      const blob=item instanceof Blob?item:(item&&item.blob instanceof Blob?item.blob:null);
      if(blob) imgs.push({mimeType:blob.type||'image/jpeg',data:await b64(blob)});
    }
    const headers={'Content-Type':'application/json'};
    if(cfg.token) headers.Authorization='Bearer '+cfg.token;
    const res=await fetch(cfg.url,{method:'POST',headers,body:JSON.stringify({
      prompt:String(prompt||''),modelTier:opts.modelTier||'default',images:imgs
    })});
    if(res.status===429) throw {code:'rate_limited'};
    if(!res.ok) throw {code:'gateway',status:res.status};
    const body=await res.json();
    let out=body.result??body.output??body.content??body;
    if(body.choices&&body.choices[0]&&body.choices[0].message) out=body.choices[0].message.content;
    if(typeof out==='string'){
      const t=out.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');
      try{return JSON.parse(t)}catch(_){return {text:out}}
    }
    return out;
  }
  const sample=async(prompt,opts={})=>({text:(await request(prompt,opts)).text||'bereit'});
  sample.json=(prompt,opts={})=>request(prompt,opts);
  sample.limits=async()=>({images:true});
  const assets={upload:async(blob)=>{
    const url=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob)});
    return {id:'local-'+Date.now()+'-'+Math.random().toString(16).slice(2),url};
  }};
  window.claude={use:async name=>{
    if(name==='sample') return sample;
    if(name==='assets') return assets;
    if(name==='user') return {me:async()=>null,id:async()=>null};
    if(name==='db') return null;
    if(name==='downloads') return null;
    return null;
  }};
})();
</script>

const LNX=[['Karbonatsystem und Alkalinität','Die KH misst, wie viel Puffer im Wasser steckt. Korallen verbrauchen ihn beim Wachstum, deshalb sinkt die KH ohne Zugabe. Wichtig ist, sie stabil zu halten. Große Sprünge und starke Änderungen an einem Tag stressen die Tiere.'],['Licht: PAR, Spektrum und Eingewöhnung','Korallen brauchen je nach Art unterschiedlich viel Licht. Neue Korallen setzt du zuerst tiefer oder schattiger ein und steigerst das Licht über mehrere Wochen, damit sie nicht ausbleichen.'],['Strömung','Gute Strömung bringt Futter und Sauerstoff zu den Korallen und trägt Abfall weg. Wechselnde Richtungen sind besser als ein starker Strahl. Die Korallen sollen sich sanft bewegen, nicht gebeugt liegen.'],['Spurenelemente und ICP','Spurenelemente wie Jod, Strontium oder Eisen werden verbraucht und ersetzt. Ein ICP-Test zeigt Mangel und Ballast. Dosiere nur nach Messung und in kleinen Schritten.'],['Füttern','Weniger ist mehr: Füttere nur so viel, wie die Fische in wenigen Minuten fressen. Überfütterung erhöht Nitrat und Phosphat und fördert Algen.'],['Algen verstehen','Algen gehören zum Riff, werden aber zum Problem bei zu viel Licht oder Nährstoffen. Erst Ursachen beheben, dann entfernen, sonst kommen sie zurück.'],['Notfall: Stromausfall und Hitze','Bei Stromausfall Strömung und Belüftung so schnell wie möglich wiederherstellen und nicht füttern. Bei Hitze Beleuchtung dimmen, Deckel öffnen und mit Lüfter kühlen. Habe Notfallgeräte wie eine Batteriepumpe parat.'],['Quarantäne in Schritten','Neue Fische kommen in ein eigenes Becken, werden dort beobachtet und bei Bedarf behandelt. Dauer und Behandlung richten sich nach Art und Herstellerangaben. Erst danach ziehen sie ins Hauptbecken.'],['Korallen eingewöhnen','Korallen vor dem Einsetzen auf Schädlinge prüfen und dippen. Setze sie an eine ruhige Stelle mit mittlerem Licht und beobachte, ob sich die Polypen öffnen.'],['Messfehler vermeiden','Teste immer nach der gleichen Methode, benutze frische Test-Kits und kalibriere das Refraktometer mit Eichlösung. Notiere auffällige Werte und miss zur Kontrolle noch einmal.']];
